# Arbora encrypted-vault server on Cloudflare Workers + R2.
# Deploy:  npm install && npx wrangler login && npm run setup && npm run deploy
name = "arbora-vault"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "VAULTS"
bucket_name = "arbora-vaults"

# Zero-knowledge promise: no request logs kept by the Worker.
[observability]
enabled = false

# Abuse limits, per IP per 60 s (see src/worker.js). namespace_id is any
# account-unique number.
[[ratelimits]]
name = "REQ_LIMIT"
namespace_id = "7101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "7102"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "MISS_LIMIT"
namespace_id = "7103"
simple = { limit = 10, period = 60 }
